name: Python binding

on:
  workflow_dispatch:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

permissions:
  contents: read

concurrency:
  group: python-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-ci:
    runs-on: ubuntu-22.04
    outputs:
      abi3: ${{ steps.matrix.outputs.abi3 }}
      native: ${{ steps.matrix.outputs.native }}
      runtime: ${{ steps.matrix.outputs.runtime }}
      alternative: ${{ steps.matrix.outputs.alternative }}
      build: ${{ steps.changes.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install packaging
      - name: Check whether build inputs changed
        id: changes
        run: python ci/changes.py
      - name: Generate build matrices
        id: matrix
        run: python ci/platforms.py
      - run: python -m unittest discover -s ci -p 'test_*.py'
      - run: node --test ci/test_build_status.cjs

  lint:
    needs: check-ci
    if: needs.check-ci.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.check-ci.outputs.abi3) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          key: python-lint-${{ matrix.os }}-3.12
          save-if: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt -p aliyun-log-producer-python --check
      - name: Check binding Rust code
        run: cargo clippy --locked -p aliyun-log-producer-python --all-targets --no-deps -- -D warnings

  build-abi3:
    needs: check-ci
    if: needs.check-ci.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.check-ci.outputs.abi3) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: python-abi3-${{ matrix.os }}-3.12
          save-if: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
      - name: Install build and ABI audit tools
        run: python -m pip install maturin==1.15.0 packaging abi3audit
      # These are host-platform CI wheels. Portable manylinux/musllinux release
      # wheels require their own build images and native dependency audit.
      - name: Build one ABI3 wheel for this platform
        run: python -m maturin build --locked --release --manifest-path Cargo.toml --interpreter python --compatibility linux --out wheelhouse
      - name: Verify wheel metadata and stable ABI symbols
        run: python ci/check_wheel.py wheelhouse --audit
      - uses: actions/upload-artifact@v4
        with:
          name: python-abi3-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  build-and-test:
    needs: check-ci
    if: needs.check-ci.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.check-ci.outputs.native) }}
    name: build-and-test (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: matrix.os != 'macos-15' || matrix.python != '3.9'
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v6
        if: matrix.os == 'macos-15' && matrix.python == '3.9'
      - name: Install older macOS ARM64 interpreter
        if: matrix.os == 'macos-15' && matrix.python == '3.9'
        env:
          TEST_PYTHON: ${{ matrix.python }}
        run: |
          uv venv --python "$TEST_PYTHON" --seed .venv-ci
          echo "$PWD/.venv-ci/bin" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: python-native-${{ matrix.os }}-${{ matrix.python }}
          save-if: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
      - name: Install build tool
        run: python -m pip install maturin==1.15.0 packaging
      - name: Build a wheel for this Python version
        run: python -m maturin build --locked --release --no-default-features --manifest-path Cargo.toml --interpreter python --compatibility linux --out wheelhouse/native
      - name: Check and install version-specific package
        run: python ci/check_wheel.py wheelhouse/native --kind native --install
      - name: Test version-specific package
        run: python -m pytest tests -q
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: python-native-${{ matrix.os }}-${{ matrix.python }}
          path: wheelhouse/native/*.whl
          if-no-files-found: error

  test-abi3:
    needs: [check-ci, build-abi3, build-and-test]
    # A failed sibling build must not skip tests for available artifacts.
    if: ${{ !cancelled() && needs.check-ci.result == 'success' && needs.check-ci.outputs.build == 'true' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.check-ci.outputs.runtime) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: matrix.os != 'macos-15' || (matrix.python != '3.8' && matrix.python != '3.9')
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v6
        if: matrix.os == 'macos-15' && (matrix.python == '3.8' || matrix.python == '3.9')
      - name: Install older macOS ARM64 interpreter
        if: matrix.os == 'macos-15' && (matrix.python == '3.8' || matrix.python == '3.9')
        env:
          TEST_PYTHON: ${{ matrix.python }}
        run: |
          uv venv --python "$TEST_PYTHON" --seed .venv-ci
          echo "$PWD/.venv-ci/bin" >> "$GITHUB_PATH"
      - run: python -m pip install packaging
      - uses: actions/download-artifact@v4
        with:
          name: python-abi3-${{ matrix.os }}
          path: wheelhouse/abi3
      - name: Install the shared wheel without a source-build fallback
        run: python ci/check_wheel.py wheelhouse/abi3 --install
      - name: Test ABI3 package
        run: python -m pytest tests -q
      - name: Verify ABI3-only selection
        run: python ci/check_selection.py wheelhouse/abi3
      - uses: actions/download-artifact@v4
        if: matrix.native
        with:
          name: python-native-${{ matrix.os }}-${{ matrix.python }}
          path: wheelhouse/native
      - name: Verify native preference and ABI3 selection
        if: matrix.native
        run: python ci/check_selection.py wheelhouse/abi3 wheelhouse/native

  alternative-runtimes:
    needs: check-ci
    if: needs.check-ci.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.check-ci.outputs.alternative) }}
    name: runtime (${{ matrix.os }}, ${{ matrix.kind }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.setup_python }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: python-runtime-${{ matrix.os }}-${{ matrix.kind }}-${{ matrix.setup_python }}
          save-if: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
      # Build tooling runs on CPython; maturin receives the target interpreter.
      # This avoids requiring a maturin wheel for the alternate runtime itself.
      - name: Record target interpreter
        shell: bash
        run: echo "TARGET_PYTHON=$(python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install maturin==1.15.0
      - name: Build runtime wheel
        shell: bash
        run: python -m maturin build --locked --release --no-default-features --manifest-path Cargo.toml --interpreter "$TARGET_PYTHON" --compatibility linux --out wheelhouse/runtime
      - name: Verify, install and test runtime wheel
        shell: bash
        run: |
          "$TARGET_PYTHON" -m pip install packaging
          "$TARGET_PYTHON" ci/check_wheel.py wheelhouse/runtime --kind "${{ matrix.kind }}" --install
          "$TARGET_PYTHON" -m pytest tests -vv --tb=short
          "$TARGET_PYTHON" ci/check_selection.py wheelhouse/runtime --kind "${{ matrix.kind }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-runtime-${{ matrix.os }}-${{ matrix.kind }}-${{ matrix.python }}
          path: wheelhouse/runtime/*.whl
          if-no-files-found: ignore

  collect-wheels:
    needs: [check-ci, build-abi3, build-and-test, alternative-runtimes]
    # Preserve available wheels even when another matrix entry failed.
    if: ${{ !cancelled() && needs.check-ci.outputs.build == 'true' }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: python-abi3-*
          path: wheelhouse
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: python-native-*
          path: wheelhouse
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: python-runtime-*
          path: wheelhouse
          merge-multiple: true
      - uses: actions/upload-artifact@v4
        with:
          name: python-wheels
          path: wheelhouse/*.whl
          if-no-files-found: error

  ci-result:
    name: Python CI
    if: always()
    needs:
      [
        check-ci,
        lint,
        build-abi3,
        build-and-test,
        test-abi3,
        alternative-runtimes,
        collect-wheels,
      ]
    runs-on: ubuntu-22.04
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PYCODE'
          import json, os
          results = json.loads(os.environ["RESULTS"])
          build = results["check-ci"]["outputs"].get("build") == "true"
          failed = [name for name, job in results.items()
                    if job["result"] in ("failure", "cancelled")
                    or ((build or name == "check-ci") and job["result"] != "success")]
          if failed:
              raise SystemExit("Failed jobs: " + ", ".join(failed))
          PYCODE
